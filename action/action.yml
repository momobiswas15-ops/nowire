name: nowire local PR review
description: Review pull requests with a local Ollama model without sending source code to a hosted AI API.
inputs:
  model:
    description: Ollama model
    default: qwen2.5-coder:7b
  fail-on:
    description: Minimum severity that fails the check
    default: high
  ollama-url:
    description: Ollama endpoint
    default: http://127.0.0.1:11434
runs:
  using: composite
  steps:
    - name: Install Ollama
      shell: bash
      run: curl -fsSL https://ollama.com/install.sh | sh
    - name: Start Ollama and pull model
      shell: bash
      run: |
        nohup ollama serve >/tmp/ollama.log 2>&1 &
        for i in {1..30}; do curl -sf http://127.0.0.1:11434/api/tags && break || sleep 1; done
        ollama pull "${{ inputs.model }}"
    - name: Install nowire
      shell: bash
      run: go install github.com/nowire/nowire/cmd/nowire@v0.1.0
    - name: Review pull request
      shell: bash
      run: nowire review --format markdown --output nowire-review.md --fail-on "${{ inputs.fail-on }}"
    - name: Publish review summary
      if: always()
      shell: bash
      run: cat nowire-review.md >> "$GITHUB_STEP_SUMMARY"
